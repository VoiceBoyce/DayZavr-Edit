verifySignatures = 2;       // Verifies .pbos against .bisign files. (only 2 is supported)
forceSameBuild = 1;         // When enabled, the server will allow the connection only to clients with same the .exe revision as the server (value 0-1)
 
disableVoN = 0;             // Enable/disable voice over network (value 0-1)
vonCodecQuality = 20;        // Voice over network codec quality, the higher the better (values 0-30)
 
disable3rdPerson=0;         // Toggles the 3rd person view for players (value 0-1)
disableCrosshair=0;         // Toggles the cross-hair (value 0-1)

disablePersonalLight = 0;   // Disables personal light for all clients connected to server
lightingConfig = 0;         // 0 for brighter night setup, 1 for darker night setup
 
serverTime="2026/7/15/9/32";    // Initial in-game time of the server. "SystemTime" means the local time of the machine. Another possibility is to set the time to some value in "YYYY/MM/DD/HH/MM" format, f.e. "2015/4/8/17/23" .
serverTimeAcceleration=5;  // DayZavr 2026-11-16: was 4. Day ~2h35-3h00 (10.08-10.09 Livonia). Accelerated Time (value 0-24)
serverNightTimeAcceleration=2.5;  // DayZavr 2026-11-16: was 6. Night x12.5 (5*2.5): ~43-53 min. Accelerated Nigh Time (0.1-64)
serverTimePersistent=1;     // Persistent Time (value 0-1)// The actual server time is saved to storage, so when active, the next server start will use the saved time value.

guaranteedUpdates=1;        // Communication protocol used with game server (use only number 1)

maxPing= 20000;               // Max ping value until server kick the user (value in milliseconds)


multithreadedReplication = 1; // enables multi-threaded processing of server's replication system - number of worker threads is derived by settings of jobsystem in dayzSettings.xml by "maxcores" and "reservedcores


timeStampFormat = "Short";  // Format for timestamps in the .rpt file (value Full/Short)
logAverageFps = 3;          // Logs the average server FPS (value in seconds), needs to have ''-doLogs'' launch parameter active
logMemory = 3;              // Logs the server memory usage (value in seconds), needs to have the ''-doLogs'' launch parameter active
logPlayers = 3;             // Logs the count of currently connected players (value in seconds), needs to have the ''-doLogs'' launch parameter active
logFile = "server_console.log";// Saves the server console log to a file in the folder with the other server logs
 
loginQueueConcurrentPlayers=2;  // The number of players concurrently processed during the login process. Should prevent massive performance drop during connection when a lot of people are connecting at the same time.
loginQueueMaxPlayers=500;       // The maximum number of players that can wait in login queue
 
instanceId = 1;             // DayZ server instance id, to identify the number of instances per box and their storage folders with persistence files

storageAutoFix = 1;         // Checks if the persistence files are corrupted and replaces corrupted ones with empty ones (value 0-1)

 
