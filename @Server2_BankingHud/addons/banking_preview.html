<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сейф — превью</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #111;
    display: flex; justify-content: center; align-items: center;
    height: 100vh;
    font-family: 'Oswald', sans-serif;
  }
  .frame {
    width: 547px; min-height: 466px;
    background: linear-gradient(180deg, rgba(24,28,38,0.97) 0%, rgba(18,21,28,0.97) 100%);
    border: 1px solid rgba(255,255,255,0.06);
    position: relative;
    border-radius: 6px;
    padding: 24px 28px 20px;
    display: flex; flex-direction: column;
    gap: 16px;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }

  /* ── Title ── */
  .title {
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.25);
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  /* ── Balance cards row ── */
  .balance-row {
    display: flex; gap: 14px;
  }
  .card {
    flex: 1;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 4px;
    padding: 14px 16px 10px;
    display: flex; flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .card .label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .card.bank .label { color: #8ccc73; }
  .card.cash .label { color: #73b8d9; }
  .card .value {
    font-size: 26px;
    font-weight: 700;
    color: #e8e8e8;
    letter-spacing: 1px;
  }
  /* Progress bar inside bank card */
  .progress-wrap {
    margin-top: 8px;
    height: 4px;
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: #8ccc73;
    border-radius: 2px;
    transition: width 0.3s;
  }
  .capacity-text {
    font-size: 10px;
    color: rgba(255,255,255,0.2);
    margin-top: 4px;
    text-align: right;
  }

  /* ── Input area ── */
  .input-area {
    display: flex; flex-direction: column;
    gap: 8px;
  }
  .input-row {
    display: flex; align-items: center;
    gap: 12px;
  }
  .input-label {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
  }
  .input-wrapper {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 4px;
    padding: 8px 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-wrapper.focus {
    border-color: rgba(255,255,255,0.25);
    box-shadow: 0 0 8px rgba(255,255,255,0.04);
  }
  .input-wrapper.invalid {
    border-color: rgba(220, 60, 40, 0.6);
    box-shadow: 0 0 10px rgba(220, 60, 40, 0.15);
  }
  .input-wrapper.valid {
    border-color: rgba(100, 180, 100, 0.4);
  }
  .amount-input {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    font-family: 'Oswald', sans-serif;
    width: 100%;
    text-align: right;
    outline: none;
    letter-spacing: 1px;
  }
  .amount-input::placeholder { color: rgba(255,255,255,0.12); }

  /* ── Preset buttons ── */
  .presets {
    display: flex; gap: 6px;
    justify-content: flex-end;
  }
  .preset {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.07);
    color: rgba(255,255,255,0.4);
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.5px;
    padding: 4px 12px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }
  .preset:hover {
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.75);
    border-color: rgba(255,255,255,0.15);
  }
  .preset.active {
    background: rgba(140, 204, 115, 0.12);
    border-color: rgba(140, 204, 115, 0.3);
    color: #8ccc73;
  }

  /* ── Hint text ── */
  .hint {
    font-size: 10px;
    color: rgba(255,255,255,0.15);
    text-align: right;
    min-height: 15px;
    transition: color 0.2s;
  }
  .hint.warn { color: rgba(220, 160, 40, 0.6); }
  .hint.error { color: rgba(220, 60, 40, 0.6); }

  /* ── Action buttons ── */
  .actions {
    display: flex; gap: 10px;
    margin-top: auto;
  }
  .btn {
    flex: 1;
    height: 44px;
    border: none;
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    color: #fff;
    border-radius: 4px;
    text-transform: uppercase;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
    position: relative;
    overflow: hidden;
  }
  .btn:hover  { filter: brightness(1.15); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn .arrow { font-size: 18px; line-height: 1; }
  .btn.deposit  { background: rgba(64, 100, 34, 0.9);  }
  .btn.withdraw { background: rgba(110, 78, 22, 0.9); }
  .btn.close    { background: rgba(100, 30, 22, 0.9);  flex: 0.6; }

  /* ── Message panel ── */
  .msg-panel {
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,200,40,0.12);
    border-radius: 3px;
    padding: 8px 14px;
    color: #ffe080;
    font-size: 11px;
    text-align: center;
    display: none;
    transition: opacity 0.2s;
  }
  .msg-panel.show { display: block; }
</style>
</head>
<body>

<div class="frame">
  <div class="title">Банковский сейф</div>

  <!-- Balance cards -->
  <div class="balance-row">
    <div class="card bank">
      <span class="label">В банке</span>
      <span class="value" id="bankBalance">1 250 000</span>
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar" style="width: 25%"></div>
      </div>
      <span class="capacity-text">Вместимость: <span id="capacityValue">5 000 000</span> ₽</span>
    </div>
    <div class="card cash">
      <span class="label">При себе</span>
      <span class="value" id="cashBalance">48 500</span>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <span class="input-label">Сумма</span>
      <div class="input-wrapper" id="inputWrapper">
        <input class="amount-input" id="amountInput" value="0" placeholder="0" autofocus>
      </div>
    </div>
    <div class="presets">
      <button class="preset" data-amount="cash-all">Всё с рук</button>
      <button class="preset" data-amount="bank-all">Всё из банка</button>
      <button class="preset" data-amount="half-bank">Половина</button>
      <button class="preset" data-amount="10000">10 000</button>
      <button class="preset" data-amount="100000">100 000</button>
    </div>
    <div class="hint" id="hint">Введите сумму</div>
  </div>

  <!-- Message -->
  <div class="msg-panel" id="msg">
    Недостаточно места в инвентаре. Непоместившаяся сумма возвращена на счёт.
  </div>

  <!-- Buttons -->
  <div class="actions">
    <button class="btn deposit" id="btnDeposit">
      <span class="arrow">↓</span> Вложить
    </button>
    <button class="btn withdraw" id="btnWithdraw">
      <span class="arrow">↑</span> Снять
    </button>
    <button class="btn close" id="btnClose">✕</button>
  </div>
</div>

<script>
  // ── State ──
  const state = {
    bank: 1250000,
    cash: 48500,
    capacity: 5000000,
    mode: null  // 'deposit' | 'withdraw' | null
  };

  const el = {
    bankBalance: document.getElementById('bankBalance'),
    cashBalance: document.getElementById('cashBalance'),
    capacityValue: document.getElementById('capacityValue'),
    progressBar: document.getElementById('progressBar'),
    amountInput: document.getElementById('amountInput'),
    inputWrapper: document.getElementById('inputWrapper'),
    hint: document.getElementById('hint'),
    msg: document.getElementById('msg'),
    btnDeposit: document.getElementById('btnDeposit'),
    btnWithdraw: document.getElementById('btnWithdraw'),
    btnClose: document.getElementById('btnClose')
  };

  // ── Format number ──
  function fmt(n) {
    return n.toLocaleString('ru-RU');
  }

  function parseInput(val) {
    return parseInt(val.replace(/\s/g, ''), 10) || 0;
  }

  function updateUI() {
    el.bankBalance.textContent = fmt(state.bank);
    el.cashBalance.textContent = fmt(state.cash);
    el.capacityValue.textContent = fmt(state.capacity);
    const pct = Math.min(100, (state.bank / state.capacity) * 100);
    el.progressBar.style.width = pct + '%';

    // Progress bar color based on fill
    if (pct > 90) el.progressBar.style.background = '#d94a3a';
    else if (pct > 70) el.progressBar.style.background = '#d9a83a';
    else el.progressBar.style.background = '#8ccc73';
  }

  function validate() {
    const raw = el.amountInput.value;
    const amount = parseInput(raw);

    el.inputWrapper.classList.remove('invalid', 'valid', 'focus');
    el.hint.classList.remove('warn', 'error');

    if (amount <= 0) {
      el.hint.textContent = 'Введите сумму';
      el.hint.classList.add('warn');
      return;
    }

    // Based on which button was last hovered (or we could do mode detection)
    // For now, validate against both
    const canDeposit = amount <= state.cash;
    const canWithdraw = amount <= state.bank;
    const fitsCapacity = (state.bank + amount) <= state.capacity;

    if (!canDeposit && !canWithdraw) {
      el.inputWrapper.classList.add('invalid');
      el.hint.textContent = 'Недостаточно средств ни на руках, ни в банке';
      el.hint.classList.add('error');
    } else if (state.mode === 'deposit' && !canDeposit) {
      el.inputWrapper.classList.add('invalid');
      el.hint.textContent = 'Недостаточно наличных';
      el.hint.classList.add('error');
    } else if (state.mode === 'deposit' && !fitsCapacity) {
      el.inputWrapper.classList.add('invalid');
      el.hint.textContent = 'Превышена вместимость сейфа';
      el.hint.classList.add('error');
    } else if (state.mode === 'withdraw' && !canWithdraw) {
      el.inputWrapper.classList.add('invalid');
      el.hint.textContent = 'Недостаточно средств в банке';
      el.hint.classList.add('error');
    } else if (state.mode === 'deposit') {
      el.inputWrapper.classList.add('valid');
      el.hint.textContent = 'Можно положить ' + fmt(amount) + ' ₽';
    } else if (state.mode === 'withdraw') {
      el.inputWrapper.classList.add('valid');
      el.hint.textContent = 'Можно снять ' + fmt(amount) + ' ₽';
    } else {
      el.hint.textContent = 'Выберите действие';
    }
  }

  // ── Event handlers ──
  el.amountInput.addEventListener('input', function() {
    // Auto-format with spaces
    const cursor = this.selectionStart;
    const raw = this.value.replace(/\s/g, '');
    if (raw === '') {
      this.value = '';
      validate();
      return;
    }
    const num = parseInt(raw, 10);
    if (isNaN(num)) {
      this.value = '';
      validate();
      return;
    }
    const formatted = fmt(num);
    this.value = formatted;
    // Restore cursor approximately
    const diff = formatted.length - raw.length;
    this.setSelectionRange(cursor + diff, cursor + diff);
    validate();
  });

  el.amountInput.addEventListener('focus', () => {
    el.inputWrapper.classList.add('focus');
    if (el.amountInput.value === '0') el.amountInput.value = '';
  });

  el.amountInput.addEventListener('blur', () => {
    el.inputWrapper.classList.remove('focus');
    if (el.amountInput.value === '' || parseInput(el.amountInput.value) === 0) {
      el.amountInput.value = '0';
    }
    validate();
  });

  // Preset buttons
  document.querySelectorAll('.preset').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.preset').forEach(b => b.classList.remove('active'));
      this.classList.add('active');

      const val = this.dataset.amount;
      let amount = 0;
      switch (val) {
        case 'cash-all':  amount = state.cash; break;
        case 'bank-all':  amount = state.bank; break;
        case 'half-bank': amount = Math.floor(state.bank / 2); break;
        case '10000':     amount = 10000; break;
        case '100000':    amount = 100000; break;
        default:          amount = parseInt(val, 10) || 0;
      }
      el.amountInput.value = fmt(amount);
      validate();
    });
  });

  // Button hover — switch mode & validate
  el.btnDeposit.addEventListener('mouseenter', () => {
    state.mode = 'deposit';
    validate();
  });
  el.btnWithdraw.addEventListener('mouseenter', () => {
    state.mode = 'withdraw';
    validate();
  });
  el.btnDeposit.addEventListener('mouseleave', () => {
    state.mode = null;
    validate();
  });
  el.btnWithdraw.addEventListener('mouseleave', () => {
    state.mode = null;
    validate();
  });

  // Button clicks — simulate action
  function simulateAction(type) {
    const amount = parseInput(el.amountInput.value);
    if (amount <= 0) {
      el.hint.textContent = 'Введите сумму больше нуля';
      el.hint.classList.add('error');
      return;
    }
    if (type === 'deposit') {
      if (amount > state.cash) {
        el.inputWrapper.classList.add('invalid');
        el.hint.textContent = 'Недостаточно наличных';
        el.hint.classList.add('error');
        return;
      }
      if (state.bank + amount > state.capacity) {
        el.inputWrapper.classList.add('invalid');
        el.hint.textContent = 'Превышена вместимость сейфа';
        el.hint.classList.add('error');
        return;
      }
      state.cash -= amount;
      state.bank += amount;
      el.msg.classList.remove('show');
    } else if (type === 'withdraw') {
      if (amount > state.bank) {
        el.inputWrapper.classList.add('invalid');
        el.hint.textContent = 'Недостаточно средств в банке';
        el.hint.classList.add('error');
        return;
      }
      state.bank -= amount;
      state.cash += amount;
    }
    el.amountInput.value = '0';
    el.inputWrapper.classList.remove('invalid', 'valid');
    el.hint.textContent = type === 'deposit' ? 'Средства внесены' : 'Средства сняты';
    el.hint.classList.remove('warn', 'error');
    el.hint.style.color = 'rgba(140,204,115,0.6)';
    setTimeout(() => { el.hint.style.color = ''; }, 1500);
    updateUI();
  }

  el.btnDeposit.addEventListener('click', () => simulateAction('deposit'));
  el.btnWithdraw.addEventListener('click', () => simulateAction('withdraw'));

  el.btnClose.addEventListener('click', () => {
    el.msg.classList.toggle('show');
  });

  // Init
  updateUI();
  el.amountInput.focus();
</script>
</body>
</html>
