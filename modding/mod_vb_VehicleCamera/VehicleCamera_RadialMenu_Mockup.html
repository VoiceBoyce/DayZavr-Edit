:root {
	--overlay: rgba(5, 7, 10, .66);
	--window: rgba(16, 19, 22, .98);
	--window-border: rgba(255, 255, 255, .086);
	--panel: rgb(21, 25, 29);
	--panel-border: rgba(255, 255, 255, .067);
	--tile: rgb(26, 31, 36);
	--tile-hover: rgb(33, 39, 45);
	--tile-border: rgba(255, 255, 255, .055);
	--sheen: rgba(255, 255, 255, .05);
	--text: rgb(236, 239, 242);

	--faint: rgb(116, 124, 134);

	--ease-out: cubic-bezier(.22, 1, .36, 1);

body {

	color: var(--text);

	display: flex;
	flex-direction: column;
	align-items: center;
	padding: 16px;
	gap: 12px;
	overflow-x: hidden;
}

#stage.pinned { cursor: default; }

/* Круговое меню: только затемнение вокруг центра, игра не ставится на паузу */
#vignette {
	position: absolute; inset: 0; pointer-events: none;
	background: radial-gradient(circle at 50% 50%, rgba(5, 7, 10, .62) 0, rgba(5, 7, 10, .34) 300px, rgba(5, 7, 10, 0) 560px);
	opacity: 0; transition: opacity .12s linear;
}
#radial {
	position: absolute; left: 960px; top: 540px; width: 560px; height: 560px;
	margin: -280px 0 0 -280px;
	opacity: 0; transform: scale(.9); pointer-events: none;
	transition: opacity .12s linear, transform .18s var(--ease-out);
}
.open #radial { opacity: 1; transform: scale(1); }
.open #vignette { opacity: 1; }
svg { position: absolute; inset: 0; overflow: visible; }

.sector-bg { fill: rgba(21, 25, 29, .94); stroke: rgba(255, 255, 255, .09); stroke-width: 1; transition: fill .1s linear, stroke .1s linear; }
.sector.is-hover .sector-bg { fill: rgb(30, 49, 48); stroke: rgba(79, 216, 182, .62); }
.sector-arc { fill: none; stroke: var(--teal); stroke-width: 4; stroke-linecap: round; opacity: 0; transition: opacity .1s linear; }
.sector.is-hover .sector-arc { opacity: 1; }
.sector-glow { fill: none; stroke: var(--teal); stroke-width: 14; stroke-linecap: round; opacity: 0; filter: blur(9px); transition: opacity .1s linear; }
.sector.is-hover .sector-glow { opacity: .42; }

#labels, #hub, #pointer, #desc { position: absolute; }
#labels { inset: 0; pointer-events: none; }
.label {
	position: absolute; width: 164px; margin-left: -82px; text-align: center;
	transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.label svg { position: static; width: 34px; height: 34px; color: var(--muted); transition: color .1s linear; }
.label b { font-size: 19px; font-weight: 600; color: var(--muted); transition: color .1s linear; }
.label .state { height: 16px; font-size: 11px; letter-spacing: .09em; color: var(--teal); text-transform: uppercase; }
.label.is-hover svg { color: var(--teal); }
.label.is-hover b { color: var(--text); }
.label.is-current b { color: var(--text); }

#hub {
	left: 188px; top: 188px; width: 184px; height: 184px; border-radius: 50%;
	background: var(--window); box-shadow: 0 0 0 1px var(--window-border), inset 0 1px 0 var(--sheen);
	display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 0 16px;
}
#hub small { font-size: 11px; letter-spacing: .1em; color: var(--faint); text-transform: uppercase; }
#hub strong { font-size: 21px; font-weight: 600; line-height: 1.15; }
#hub.is-zoom strong { font-size: 30px; color: var(--teal); }

#pointer {
	left: 280px; top: 280px; width: 0; height: 0; opacity: 0; transition: opacity .08s linear;
}
#pointer i {
	position: absolute; left: -6px; top: -122px; width: 12px; height: 12px; border-radius: 50%; background: var(--teal);
}
#desc {
	left: 50%; top: 574px; transform: translateX(-50%); white-space: nowrap;
	padding: 9px 16px; border-radius: 8px;
	background: var(--window); box-shadow: 0 0 0 1px var(--window-border), inset 0 1px 0 var(--sheen);
	font-size: 15px; color: var(--muted);
	transition: opacity .1s linear;
}
#desc:empty { opacity: 0; }

#toast {
	position: absolute; right: 24px; top: 24px; width: 320px; height: 66px;
	display: flex; align-items: center; gap: 12px; padding: 0 16px;
	background: var(--window); border-radius: 10px;
	box-shadow: 0 0 0 1px var(--window-border), 0 12px 30px rgba(0, 0, 0, .5);
	opacity: 0; transform: translateX(26px); transition: opacity .16s linear, transform .22s var(--ease-out);
}
#toast.show { opacity: 1; transform: translateX(0); }
#toast span { width: 4px; height: 34px; border-radius: 2px; background: var(--teal); }
#toast b { display: block; font-size: 15px; font-weight: 600; }
#toast small { color: var(--muted); font-size: 13px; }

/* Панель макета: это не часть игрового интерфейса */
#bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; font-size: 14px; color: var(--muted); }
.seg { display: inline-flex; padding: 3px; background: var(--panel); border-radius: 8px; box-shadow: 0 0 0 1px var(--panel-border); }
.seg button, .btn {
	font: inherit; color: var(--muted); background: none; border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--tile-hover); color: var(--text); }
.btn { background: var(--panel); box-shadow: 0 0 0 1px var(--panel-border); }
.btn[aria-pressed="true"] { color: var(--teal); }
kbd { font: inherit; color: var(--text); background: var(--tile); border-radius: 5px; padding: 1px 7px; box-shadow: 0 0 0 1px var(--tile-border); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="frame">
	<div id="stage">
		<div id="vignette"></div>
		<div id="radial">
			<svg id="wheel" viewBox="0 0 560 560" width="560" height="560" aria-hidden="true"></svg>
			<div id="labels"></div>
			<div id="pointer"><i></i></div>
			<div id="hub"><small id="hubCap"></small><strong id="hubName"></strong></div>
			<div id="desc"></div>
		</div>
		<div id="toast"><span></span><div><b id="toastTitle"></b><small id="toastText"></small></div></div>
	</div>
</div>
<div id="bar">
	<button class="btn" id="pin" aria-pressed="false">Закрепить меню</button>
	<span>В игре меню открывается на <kbd>Alt+V</kbd>. В макете удерживайте <kbd>Пробел</kbd>, наведите на сектор и отпустите. Колесо при открытом меню меняет дальность, в игре то же делает Alt + колесо без меню.</span>
</div>

<script>
const ICONS = {
	lock: '<rect x="6" y="11" width="12" height="9" rx="2"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/>',
	eye: '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/>',
	pin: '<path d="M12 21s6.5-5.7 6.5-11A6.5 6.5 0 0 0 5.5 10c0 5.3 6.5 11 6.5 11Z"/><circle cx="12" cy="10" r="2.3"/>'

const MODES = {
	vanilla: { title: 'Ванильная', icon: 'lock', desc: 'Камера из обычной игры' },
	free: { title: 'Свободная', icon: 'eye', desc: 'Обзор 360°, на ходу сама возвращается за корму' }
};
const VARIANTS = {
	a: [{ id: 'vanilla', mid: 180 }, { id: 'free', mid: 0 }]

const CX = 280, CY = 280, R_OUT = 250, R_IN = 100, GAP = 8, DEADZONE = 62, ZOOM_STEP = .5, ZOOM_MAX = 3;

const params = new URLSearchParams(location.search);
const state = {

	current: 'free',
	hover: null,
	open: false,
	pinned: params.get('open') === '1',
	zoom: Number(params.get('zoom')) || 0,
	zoomShown: false

const stage = document.getElementById('stage');
const frame = document.getElementById('frame');
const wheel = document.getElementById('wheel');

const hubEl = document.getElementById('hub');

const pinBtn = document.getElementById('pin');
const toast = document.getElementById('toast');
let scale = 1, zoomTimer = 0, toastTimer = 0;

function fit() {
	const w = Math.min(document.documentElement.clientWidth - 32, (window.innerHeight - 92) * 16 / 9);
	scale = Math.max(w, 320) / 1920;
	frame.style.width = 1920 * scale + 'px';
	frame.style.height = 1080 * scale + 'px';
	stage.style.transform = 'scale(' + scale + ')';
}
function polar(radius, deg) {
	const a = deg * Math.PI / 180;
	return [CX + radius * Math.cos(a), CY + radius * Math.sin(a)];
}
// Зазор одной ширины по всей длине: у внутреннего края нужен больший угол, чем у внешнего
function gapAngle(radius) {
	return Math.asin(GAP / 2 / radius) * 180 / Math.PI;
}
function sectorPath(mid, half) {
	const out = gapAngle(R_OUT), inn = gapAngle(R_IN);
	const [x1, y1] = polar(R_OUT, mid - half + out), [x2, y2] = polar(R_OUT, mid + half - out);
	const [x3, y3] = polar(R_IN, mid + half - inn), [x4, y4] = polar(R_IN, mid - half + inn);
	const large = half * 2 - out * 2 > 180 ? 1 : 0;
	return 'M' + x1 + ' ' + y1 + 'A' + R_OUT + ' ' + R_OUT + ' 0 ' + large + ' 1 ' + x2 + ' ' + y2 +
		'L' + x3 + ' ' + y3 + 'A' + R_IN + ' ' + R_IN + ' 0 ' + large + ' 0 ' + x4 + ' ' + y4 + 'Z';
}
function arcPath(radius, from, to) {
	const [x1, y1] = polar(radius, from), [x2, y2] = polar(radius, to);
	return 'M' + x1 + ' ' + y1 + 'A' + radius + ' ' + radius + ' 0 ' + (to - from > 180 ? 1 : 0) + ' 1 ' + x2 + ' ' + y2;
}
function build() {
	const items = VARIANTS[state.variant];
	const half = 180 / items.length;
	wheel.innerHTML = '';
	labels.innerHTML = '';
	items.forEach(item => {
		const from = item.mid - half + 3, to = item.mid + half - 3;
		const g =document.createElementNS('http://www.w3.org/2000/svg', 'g');
		g.setAttribute('class', 'sector');
		g.dataset.id = item.id;
		g.innerHTML = '<path class="sector-glow" d="' + arcPath(R_OUT + 8, from + 3, to - 3) + '"/>' +
			'<path class="sector-bg" d="' + sectorPath(item.mid, half) + '"/>' +
			'<path class="sector-arc" d="' + arcPath(R_OUT + 8, from + 3, to - 3) + '"/>';
		wheel.appendChild(g);

		const [x, y] = polar((R_OUT + R_IN) / 2 + 4, item.mid);
		const mode = MODES[item.id];
		const el = document.createElement('div');
		el.className = 'label';
		el.dataset.id = item.id;
		el.style.left = x + 'px';
		el.style.top = y + 'px';
		el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
			ICONS[mode.icon] + '</svg><b>' + mode.title + '</b><span class="state"></span>';
		labels.appendChild(el);
	});
	render();
}
function formatZoom() {
	if (state.zoom === 0) return 'Обычная';
	return '+' + String(state.zoom).replace('.', ',') + ' м';
}
function render() {
	stage.classList.toggle('open', state.open || state.pinned);
	stage.classList.toggle('pinned', state.pinned);
	document.querySelectorAll('.sector').forEach(el => el.classList.toggle('is-hover', el.dataset.id === state.hover));
	document.querySelectorAll('.label').forEach(el => {
		const id = el.dataset.id;
		el.classList.toggle('is-hover', id === state.hover);
		el.classList.toggle('is-current', id === state.current);
		el.querySelector('.state').textContent = id === state.current ? 'Выбрана' : '';
	});
	const shown = MODES[state.hover || state.current];
	if (state.zoomShown) {
		hubEl.classList.add('is-zoom');
		hubCap.textContent = 'Дальность';
		hubName.textContent = formatZoom();
	} else {
		hubEl.classList.remove('is-zoom');
		hubCap.textContent = 'Камера';
		hubName.textContent = shown.title;
	}
	descEl.textContent = state.hover ? MODES[state.hover].desc : 'Alt + колесо: дальность';
	pinBtn.setAttribute('aria-pressed', String(state.pinned));
}
function setHoverFrom(clientX, clientY) {
	const rect = stage.getBoundingClientRect();
	const dx = (clientX - rect.left) / scale - 960, dy = (clientY - rect.top) / scale - 540;
	const dist = Math.hypot(dx, dy);
	const angle = Math.atan2(dy, dx) * 180 / Math.PI;
	pointer.style.opacity = dist > DEADZONE ? 1 : 0;
	pointer.style.transform = 'rotate(' + (angle + 90) + 'deg)';
	if (dist <= DEADZONE) { state.hover = null; return; }
	const items = VARIANTS[state.variant], half = 180 / items.length;
	state.hover = null;
	items.forEach(item => {
		const d = Math.abs(((angle - item.mid + 540) % 360) - 180);
		if (d <= half) state.hover = item.id;
	});
}
function showToast(title, text) {
	document.getElementById('toastTitle').textContent = title;
	document.getElementById('toastText').textContent = text;
	toast.classList.add('show');
	clearTimeout(toastTimer);
	toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}
function apply() {
	if (!state.hover) return;
	if (state.hover !== state.current) {
		state.current = state.hover;
		showToast('Камера транспорта', MODES[state.current].title);
	}
}
function openMenu() { state.open = true; render(); }
function closeMenu() {
	if (!state.open) return;
	apply();
	state.open = false;
	state.hover = null;
	state.zoomShown = false;
	pointer.style.opacity = 0;
	render();
}

window.addEventListener('resize', fit);
window.addEventListener('mousemove', e => {
	if (!(state.open || state.pinned)) return;
	setHoverFrom(e.clientX, e.clientY);
	render();
});
window.addEventListener('keydown', e => {
	if (e.code === 'Space' && !e.repeat && !e.target.closest('button')) { e.preventDefault(); openMenu(); }
	if (e.code === 'Escape') { state.hover = null; state.pinned = false; closeMenu(); render(); }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') closeMenu(); });
stage.addEventListener('mousedown', e => {
	if (e.button === 1) { e.preventDefault(); openMenu(); setHoverFrom(e.clientX, e.clientY); render(); }
	if (e.button === 0 && state.pinned) { apply(); render(); }
});
window.addEventListener('mouseup', e => { if (e.button === 1) closeMenu(); });
window.addEventListener('wheel', e => {
	if (!(state.open || state.pinned)) return;
	e.preventDefault();
	state.zoom =Math.min(ZOOM_MAX, Math.max(0, state.zoom + (e.deltaY > 0 ? ZOOM_STEP : -ZOOM_STEP)));
	state.zoomShown = true;
	clearTimeout(zoomTimer);
	zoomTimer = setTimeout(() => { state.zoomShown = false; render(); }, 1200);
	render();
}, { passive: false });
pinBtn.addEventListener('click', () => { state.pinned = !state.pinned; state.hover = null; pinBtn.blur(); render(); });

if (params.get('hover')) state.hover = params.get('hover');
if (params.get('zoomview')) state.zoomShown = true;
fit();
build();
if (state.hover) {
	const item = VARIANTS[state.variant].find(i => i.id === state.hover);
	if (item) { pointer.style.opacity = 1; pointer.style.transform = 'rotate(' + (item.mid + 90) + 'deg)'; }
}
</script>
</body>
</html>
