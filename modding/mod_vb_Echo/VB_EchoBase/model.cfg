// VB_EchoBase: модели устройств базы (генератор tools/eb_models.py). sections — выделения под hiddenSelections:
// «neon» — энергия (серый / цвет энергии / цвет уровня у источников), «tier» — метка уровня у устройств с Эхо.
// Ветряк: ротор крутится анимацией rotor (источник user «rotor», фаза 0..1 = один оборот; скрипт клиента).
class CfgSkeletons
{
	class Default
	{
		isDiscrete=1;
		skeletonInherit="";
		skeletonBones[]={};
	};
	class VB_EB_WindSkeleton: Default
	{
		skeletonBones[]={"rotor",""};
	};
	class VB_EB_ConverterSkeleton: Default
	{
		skeletonBones[]={"crystal",""};
	};
};
class CfgModels
{
	class Default
	{
		sections[]={};
		sectionsInherit="";
		skeletonName="";
	};
	class eb_wind: Default
	{
		sections[]={"neon","tier"};
		skeletonName="VB_EB_WindSkeleton";
		class Animations
		{
			class rotor
			{
				type="rotation";
				source="rotor";
				selection="rotor";
				axis="rotor_axis";
				memory=1;
				minValue=0;
				maxValue=1;
				angle0=0;
				angle1=6.2831855;
			};
		};
	};
	class eb_solar: Default
	{
		sections[]={"neon","tier"};
	};
	class eb_furnace: Default
	{
		sections[]={"neon","tier"};
	};
	// кристалл в колбе = вставленный в слот (11-20): crystal_hide прячет его без кристалла (начальная фаза 1 — скрыт,
	// голограмма установки тоже без него), crystal_spin крутит вокруг crystal_axis (фаза 0..1 = оборот, скрипт
	// клиента); crystal_glow — красит скрипт (Эхо красный, синтез бирюзовый)
	class eb_converter: Default
	{
		sections[]={"neon","tier","crystal_glow"};
		skeletonName="VB_EB_ConverterSkeleton";
		class Animations
		{
			class crystal_spin
			{
				type="rotation";
				source="crystal_spin";
				selection="crystal";
				axis="crystal_axis";
				memory=1;
				minValue=0;
				maxValue=1;
				angle0=0;
				angle1=6.2831855;
			};
			class crystal_hide
			{
				type="hide";
				source="crystal_hide";
				selection="crystal";
				minValue=0;
				maxValue=1;
				hideValue=0.5;
			};
		};
	};
	class eb_storage: Default
	{
		// lvl0..lvl11 — секции столба в колбах (снизу вверх), lamp0..lamp7 — лампы шкалы: красит скрипт по заряду
		sections[]={"neon","tier","lvl0","lvl1","lvl2","lvl3","lvl4","lvl5","lvl6","lvl7","lvl8","lvl9","lvl10","lvl11","lamp0","lamp1","lamp2","lamp3","lamp4","lamp5","lamp6","lamp7"};
	};
	class eb_station: Default
	{
		sections[]={"neon","tier"};
	};
	class eb_pad: Default
	{
		sections[]={"neon","tier"};
	};
	class eb_relay: Default
	{
		sections[]={"neon","tier"};
	};
	class eb_crystal: Default
	{
		sections[]={"neon"};
	};
	class eb_kit: Default
	{
		sections[]={"neon"};
	};
};
